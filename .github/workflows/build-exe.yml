name: Build Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller aiohttp requests

      - name: Build executable
        run: |
          pyinstaller --onefile --name locket-local-activator main.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: locket-local-activator-windows
          path: dist/locket-local-activator.exe
